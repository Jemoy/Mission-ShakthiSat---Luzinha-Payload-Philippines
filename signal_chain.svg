<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500">
<title>SEED-P payload signal chain</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  .bx  { fill:#cfdce8; stroke:#24455f; stroke-width:1.6; }
  .bxp { fill:#d8cfe8; stroke:#42285f; stroke-width:1.6; }
  .bxg { fill:#d8d8d8; stroke:#333333; stroke-width:1.6; }
  .t   { font-family:ui-sans-serif,system-ui,sans-serif; font-size:13px; font-weight:700; fill:#000000; }
  .s   { font-family:ui-sans-serif,system-ui,sans-serif; font-size:11px; font-weight:500; fill:#1f1f1f; }
  .lbl { font-family:ui-sans-serif,system-ui,sans-serif; font-size:11px; font-weight:700; fill:#000000; letter-spacing:.06em; }
  .rail{ font-family:ui-sans-serif,system-ui,sans-serif; font-size:11px; font-weight:700; fill:#000000; }
  .ln  { stroke:#000000; stroke-width:1.8; fill:none; }
</style>
<rect x="0" y="0" width="700" height="500" fill="#ffffff"/>
<text class="lbl" x="40" y="30">SENSORS</text>
<text class="lbl" x="285" y="30">CONVERSION</text>
<text class="lbl" x="420" y="30">PROCESSOR</text>
<text class="lbl" x="575" y="30">MEMORY / SPI</text>
<rect class="bx" x="40" y="50" width="100" height="52" rx="8"/><text class="t" x="54" y="74">BPX65 x2</text><text class="s" x="54" y="91">photodiode</text>
<rect class="bx" x="40" y="110" width="100" height="52" rx="8"/><text class="t" x="54" y="134">BPW34 x2</text><text class="s" x="54" y="151">photodiode</text>
<rect class="bx" x="40" y="170" width="100" height="52" rx="8"/><text class="t" x="54" y="194">3N163 A</text><text class="s" x="54" y="211">via TIA</text>
<rect class="bx" x="40" y="230" width="100" height="52" rx="8"/><text class="t" x="54" y="254">3N163 B</text><text class="s" x="54" y="271">direct</text>
<rect class="bx" x="40" y="290" width="100" height="52" rx="8"/><text class="t" x="54" y="314">ADR4525</text><text class="s" x="54" y="331">2.5 V ref</text>
<rect class="bx" x="165" y="50" width="95" height="172" rx="8"/><text class="t" x="179" y="130">OPA388</text><text class="s" x="179" y="147">x5 TIA</text>
<rect class="bx" x="285" y="50" width="105" height="292" rx="8"/><text class="t" x="299" y="190">ADS1115 x3</text><text class="s" x="299" y="207">7 ch 16-bit</text>
<rect class="bx" x="285" y="360" width="105" height="52" rx="8"/><text class="t" x="299" y="384">TMP117 x2</text><text class="s" x="299" y="401">digital</text>
<line class="ln" x1="140" y1="76" x2="161" y2="76" marker-end="url(#a)"/>
<line class="ln" x1="140" y1="136" x2="161" y2="136" marker-end="url(#a)"/>
<line class="ln" x1="140" y1="196" x2="161" y2="196" marker-end="url(#a)"/>
<line class="ln" x1="260" y1="136" x2="281" y2="136" marker-end="url(#a)"/>
<line class="ln" x1="140" y1="256" x2="281" y2="256" marker-end="url(#a)"/>
<line class="ln" x1="140" y1="316" x2="281" y2="316" marker-end="url(#a)"/>
<text class="s" x="403" y="190" text-anchor="middle">I2C</text>
<line class="ln" x1="390" y1="196" x2="416" y2="196" marker-end="url(#a)"/>
<path class="ln" d="M390 386 L405 386 L405 280 L416 280" marker-end="url(#a)"/>
<rect class="bxp" x="420" y="110" width="125" height="200" rx="8"/><text class="t" x="482" y="200" text-anchor="middle">ESP32-P4</text><text class="s" x="482" y="218" text-anchor="middle">dual RISC-V</text>
<rect class="bxg" x="575" y="120" width="85" height="42" rx="8"/><text class="t" x="587" y="139">PSRAM</text><text class="s" x="587" y="154">16 MB</text>
<rect class="bxg" x="575" y="166" width="85" height="42" rx="8"/><text class="t" x="587" y="185">Flash</text><text class="s" x="587" y="200">32 MB</text>
<rect class="bxg" x="575" y="212" width="85" height="42" rx="8"/><text class="t" x="587" y="231">FRAM</text><text class="s" x="587" y="246">32 kB</text>
<rect class="bxg" x="575" y="258" width="85" height="42" rx="8"/><text class="t" x="587" y="277">EEPROM</text><text class="s" x="587" y="292">32 kB</text>
<line class="ln" x1="545" y1="141" x2="571" y2="141" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ln" x1="545" y1="187" x2="571" y2="187" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ln" x1="545" y1="233" x2="571" y2="233" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ln" x1="545" y1="279" x2="571" y2="279" marker-start="url(#a)" marker-end="url(#a)"/>
<line class="ln" x1="482" y1="310" x2="482" y2="326" marker-start="url(#a)" marker-end="url(#a)"/>
<rect class="bxp" x="420" y="330" width="125" height="46" rx="8"/><text class="t" x="482" y="350" text-anchor="middle">UART 115200</text><text class="s" x="482" y="367" text-anchor="middle">to Main OBC</text>
<text class="s" x="40" y="450">single arrow = one way        double arrow = full duplex</text>
<text class="s" x="40" y="472">5V_SW powers OPA388, ADS1115, ADR4525        3V3_SW powers ESP32-P4, TMP117, memories</text>
</svg>